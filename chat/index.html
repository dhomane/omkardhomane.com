<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect — Omkar Dhomane</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #e6ecf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
  }
  p {
    color: #9aa7bd;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: block;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  a.btn:hover {
    opacity: 0.85;
  }
  .primary {
    background: #0771f3;
    color: #fff;
  }
  .secondary {
    background: transparent;
    color: #e6ecf5;
    border: 1px solid #2a3550;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Let's connect</h1>
    <p>Online scheduling is being rebuilt — for now, the fastest way to reach me is directly.</p>
    <div class="actions">
      <a class="btn primary" href="mailto:omkardhomane@gmail.com?subject=Let's%20connect">Email me</a>
      <a class="btn secondary" href="https://www.linkedin.com/in/dhomane" target="_blank" rel="noopener">Message on LinkedIn</a>
    </div>
  </div>
</body>
</html>
